<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Алдаа шалгагч — Монгол хэлний зөв бичгийн шалгагч</title>
    <meta name="description" content="Монгол хэлний текстийг бичих зуур шалгаж, нэг товшилтоор засна. Бүртгэлгүй, үнэгүй, хязгааргүй." />
    <meta property="og:title" content="Алдаа шалгагч — Монгол хэлний зөв бичгийн шалгагч" />
    <meta property="og:description" content="Монгол хэлний текстийг бичих зуур шалгаж, нэг товшилтоор засна." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/">
        <span class="brand__logo" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M6 19q2.5-6 5 0t5 0 5 0 5 0" /></svg>
        </span>
        <span class="brand__title">Алдаа шалгагч</span>
      </a>

      <span class="popwrap">
        <button type="button" class="topbtn" id="settings-btn" aria-haspopup="true" aria-expanded="false" title="Тохиргоо" aria-label="Тохиргоо">
          <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h10" /><path d="M18 7h2" /><circle cx="16" cy="7" r="2" /><path d="M4 17h2" /><path d="M10 17h10" /><circle cx="8" cy="17" r="2" /></svg>
        </button>
        <div class="menu" id="settings-menu" hidden>
          <label class="menu__item">
            <span>Харанхуй горим</span>
            <input type="checkbox" class="switch" id="theme-toggle" />
          </label>
          <button type="button" class="menu__item" id="clear-dict">Тольд нэмсэн үгсийг цэвэрлэх</button>
        </div>
      </span>
    </header>

    <main class="layout" id="app">
      <section class="editor" aria-label="Текст засварлагч">
        <div class="toolbar">
          <div class="history" role="group" aria-label="Түүх">
            <button type="button" class="iconbtn" id="undo-btn" title="Буцаах" aria-label="Буцаах" disabled>
              <svg class="ic" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
            </button>
            <button type="button" class="iconbtn" id="redo-btn" title="Дахин хийх" aria-label="Дахин хийх" disabled>
              <svg class="ic" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" /><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" /></svg>
            </button>
          </div>

          <div class="stats" aria-live="polite">
            <span id="stat-words">0 үг</span>
            <span class="stats__sep" aria-hidden="true">·</span>
            <span id="stat-chars">0 тэмдэгт</span>
            <span class="stats__sep" aria-hidden="true">·</span>
            <span id="stat-sentences">0 өгүүлбэр</span>
          </div>

          <span class="errcount" id="err-count" role="status" hidden></span>

          <div class="toolgroup" role="group" aria-label="Тексттэй ажиллах">
            <button type="button" class="iconbtn" id="copy-all-btn" title="Бүх текстийг хуулах" aria-label="Бүх текстийг хуулах">
              <svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5" /></svg>
            </button>
            <button type="button" class="iconbtn" id="paste-btn" title="Санах ойноос буулгах" aria-label="Санах ойноос буулгах">
              <svg class="ic" viewBox="0 0 24 24"><path d="M15 4h2.5A1.5 1.5 0 0 1 19 5.5v14a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19.5v-14A1.5 1.5 0 0 1 6.5 4H9" /><rect x="9" y="2.5" width="6" height="3.5" rx="1" /></svg>
            </button>
            <button type="button" class="iconbtn iconbtn--danger" id="clear-btn" title="Цэвэрлэх" aria-label="Цэвэрлэх">
              <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16" /><path d="M18 7v12.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19.5V7" /><path d="M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7" /></svg>
            </button>
          </div>
        </div>

        <div class="pad" id="pad">
          <div class="pad__marks" id="backdrop" aria-hidden="true"></div>
          <textarea
            id="text"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="off"
            autofocus
            aria-label="Шалгах текст"
            placeholder="Энд текстээ бичих эсвэл буулгана уу. Алдаатай үгс шууд тэмдэглэгдэнэ."
          ></textarea>
        </div>

        <div class="editor__foot">
          <div class="formatbar" id="formatbar" role="group" aria-label="Текстийн хэлбэр">
            <button type="button" class="fmtbtn" data-case="upper">БҮГД ТОМ</button>
            <button type="button" class="fmtbtn" data-case="lower">бүгд жижиг</button>
            <button type="button" class="fmtbtn" data-case="sentence">Өгүүлбэрийн хэлбэр</button>
            <button type="button" class="fmtbtn" data-case="title">Үг Бүрийн Эх Үсэг</button>
          </div>
          <p class="status" id="status" role="status"></p>
        </div>
      </section>

      <aside class="side" aria-label="Алдаатай үгс">
        <div class="side__head">
          <h2 class="side__title">Алдаатай үгс</h2>
          <button type="button" class="linkbtn" id="clear-history" title="Зассан үгсийн түүхийг цэвэрлэх">Түүх цэвэрлэх</button>
        </div>
        <div class="side__body">
          <div class="historylist" id="history-list"></div>
          <div class="empty" id="empty">
            <p class="empty__title" id="empty-title">Алдаа олдсонгүй</p>
            <p class="empty__sub" id="empty-sub">Алдаатай үг энд харагдана.</p>
          </div>
        </div>
      </aside>
    </main>

    <footer class="foot">
      Толь: <a href="https://github.com/bataak/dict-mn" target="_blank" rel="noreferrer">dict-mn</a> (MPL-2.0) ·
      <a href="https://hunspell.github.io/" target="_blank" rel="noreferrer">Hunspell</a> ·
      <a href="https://github.com/kotakunp/spellcheck-muur-app" target="_blank" rel="noreferrer">Эх код</a>
    </footer>

    <div class="hovercard" id="hover-card" hidden></div>

    <script src="/app.js"></script>
  </body>
</html>
